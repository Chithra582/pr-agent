name: "pr-description-writer"
description: "Generates markdown summaries, changelog entries, and semantic labels for pull requests."
input_schema:
  type: object
  properties:
    pr_url:
      type: string
      description: "Full URL of the pull request to describe."
    include_walkthrough:
      type: boolean
      description: "Whether to include a file-by-file walkthrough table."
      default: true
    generate_labels:
      type: boolean
      description: "Whether to suggest semantic labels based on modified components."
      default: true
  required:
    - pr_url
