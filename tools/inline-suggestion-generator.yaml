name: "inline-suggestion-generator"
description: "Generates committable inline code diffs targeting specific lines in the pull request."
input_schema:
  type: object
  properties:
    pr_url:
      type: string
      description: "Full URL of the pull request."
    num_code_suggestions:
      type: integer
      description: "Maximum number of prioritized suggestions to generate."
      default: 5
    enable_auto_checks:
      type: boolean
      description: "Whether to run static syntax checks on suggested replacements."
      default: true
  required:
    - pr_url
